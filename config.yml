# === Analysis configuration file ======================================================

__use_yte__: true  # use YAML Template Engine formatting

# --- Configuration for custom analyses in Snakefile outside of seqneut-pipeline --------

# subtypes of strains
subtypes: [H1N1, H3N2]

# `strain_type` assigned to the recent circulating strains in the viral barcodes CSV
circulating_strain_type: circulating_2025

# For the most part our analyses separate recent and historical vaccine strains, but
# consider these vaccine strains to be "recent" and include them alongside the recent strains.
recent_vaccine_strains:
  A/Croatia/10136RV/2023-egg_H3N2: 2025-2026 egg-based vaccine
  A/DistrictOfColumbia/27/2023_H3N2: 2025-2026 cell-based vaccine
  A/Victoria/4897/2022_IVR-238_H1N1: 2025-2026 egg-based vaccine
  A/Wisconsin/67/2022_H1N1: 2025-2026 cell-based vaccine
  A/Thailand/8/2022_H3N2: 2024-2025 egg-based vaccine
  A/Massachusetts/18/2022_H3N2: 2024-2025 cell-based vaccine

# Configuration relevant to aggregated analyses of human sera titers
human_sera_groups_to_exclude:  # sera groups excluded from aggregated human sera analysis
  - FCI  # these are ferret sera
human_sera_to_exclude: # individual sera excluded from aggregated human sera analysis
  - SCH_19 # This sera only got titers for 85% of viruses (below min_frac_strains = 0.9)
  - SCH_22 # This sera only got titers for 88% of viruses (below min_frac_strains = 0.9)
  - SCH_26 # This sera only got titers for 77% of viruses (below min_frac_strains = 0.9)

# Configuration for plots of titers against human sera
human_sera_plots_params:
  titer_cutoff: 140  # similar to that in https://elifesciences.org/reviewed-preprints/106811
  titer_lower_limit: 40  # lower limit of titers in assay
  min_frac_strains: 0.9  # only include sera w titers against this fraction of strains
  min_frac_sera: 0.75  # only include strains w titers against this fraction of sera
  min_frac_action: raise  # "drop" sera/strains below min_frac, or "raise" error
  facet_size: 135  # width (or height if horizontal) of each facet for each serum group
  facet_orientation: vertical  # facet serum groups as vertical or horizontal plots
  # `prop_colors` and `other_prop_colors` specify how we color the strain labels. Strains
  # are colored as "cell vaccine" and "egg vaccine" if they are an egg or cell based vaccine,
  # and are otherwise colored by subclade, as specified in the `viral_libraries` CSV. If you
  # want to assign specific colors do so via the `prop_colors` dict, and remaining ones are
  # assigned colors in a subtype specific fashion via the list in `other_prop_colors` (must
  # have sufficient entries).
  prop_colors:
    cell vaccine: black
    egg vaccine: gray
  other_prop_colors:
    - "#ffed6f"
    - "#ccebc5"
    - "#bc80bd"
    - "#fccde5"
    - "#b3de69"
    - "#fdb462"
    - "#80b1d3"
    - "#fb8072"
    - "#bebada"
    - "#8dd3c7"

# When building the alignment for nextstrain-prot-titers-tree, prepend this sequence onto
# each sequence in the alignment:
nextstrain-prot-titers-tree_prefix_alignment:
  H3N2: ""  # no prefix needs to be added as HAs in viral_barcodes start at HA1 site 1
  H1N1: DTL  # add these three amino acids as HAs in viral barcode miss first 3 ectodomain aas

# For nextstrain-prot-titers-tree, plot these serum groups:
serum_groups_for_tree: ["All", "EPIHK", "NIID", "SCH", "UWMC"]

# Configuration for `nextstrain-prot-titers-tree`. For each subtype, provided the indicated arguments
# that have the same meaning described at https://github.com/jbloomlab/nextstrain-prot-titers-tree
nextstrain-prot-titers-tree_config:
  H3N2: &H3N2
    alignment: results/nextstrain-prot-titers-tree/H3N2/alignment.fa  # built by pipeline
    outgroup: data/nextstrain-prot-titers-tree_data/H3N2_outgroup.fa
    site_numbering_map: data/nextstrain-prot-titers-tree_data/H3N2_site_numbering_map.tsv
    metadata: results/nextstrain-prot-titers-tree/H3N2/metadata.tsv  # built by pipeline
    color_by_metadata:
      strain_type: {}
      subclade: {}
      ?for group in doc["serum_groups_for_tree"]:
        ?f"median_titer_{group}_sera":
          scale_type: viridis_r_log
        ?f"frac_w_titer_below_{doc['human_sera_plots_params']['titer_cutoff']}_{group}_sera":
          scale_type: viridis_linear
    titers:
      titers_tsv: results/nextstrain-prot-titers-tree/H3N2/titers.tsv  # built by pipeline
      titer_col: log2_titer
      grouping_columns: [serum, group, collection_date_numerical, age_years, sex]
      addtl_args:
        title: serum neutralizing titers
        x-axis-label: log2 titer
        measurements-display: raw
    display_defaults:
      color_by: median_titer_All_sera
      distance_measure: div
      branch_label: aa
    results_subdir: results/nextstrain-prot-titers-tree/H3N2/pipeline_results
    auspice_json: auspice/flu-seqneut-2025_H3N2.json
    addtl_export_args:
      title: Near real-time on the human neutralizing antibody landscape to H3N2 influenza virus to inform vaccine-strain selection in September 2025
      build-url: https://github.com/jbloomlab/flu-seqneut-2025
      maintainers: Caroline Kikawa, John Huddleston, Jesse Bloom <https://jbloomlab.org>
  H1N1:
    alignment: results/nextstrain-prot-titers-tree/H1N1/alignment.fa  # built by pipeline
    outgroup: data/nextstrain-prot-titers-tree_data/H1N1_outgroup.fa
    site_numbering_map: data/nextstrain-prot-titers-tree_data/H1N1_site_numbering_map.tsv
    metadata: results/nextstrain-prot-titers-tree/H1N1/metadata.tsv  # built by pipeline
    color_by_metadata:
      strain_type: {}
      subclade: {}
      ?for group in doc["serum_groups_for_tree"]:
        ?f"median_titer_{group}_sera":
          scale_type: viridis_r_log
          exclude_auto_scale: [A/Victoria/4897/2022_IVR-238]  # egg vax strain, high titers blow out scale
        ?f"frac_w_titer_below_{doc['human_sera_plots_params']['titer_cutoff']}_{group}_sera":
          scale_type: viridis_linear
          exclude_auto_scale: [A/Victoria/4897/2022_IVR-238]  # egg vax strain, high titers blow out scale
    titers:
      titers_tsv: results/nextstrain-prot-titers-tree/H1N1/titers.tsv  # built by pipeline
      titer_col: log2_titer
      grouping_columns: [serum, group, collection_date_numerical, age_years, sex]
      addtl_args:
        title: serum neutralizing titers
        x-axis-label: log2 titer
        measurements-display: raw
    display_defaults:
      color_by: median_titer_All_sera
      distance_measure: div
      branch_label: aa
    results_subdir: results/nextstrain-prot-titers-tree/H1N1/pipeline_results
    auspice_json: auspice/flu-seqneut-2025_H1N1.json
    addtl_export_args:
      title: Near real-time on the human neutralizing antibody landscape to H1N1 influenza virus to inform vaccine-strain selection in September 2025
      build-url: https://github.com/jbloomlab/flu-seqneut-2025
      maintainers: Caroline Kikawa, John Huddleston, Jesse Bloom <https://jbloomlab.org>

# --- Configuration for `seqneut-pipeline` ----------------------------------------------

seqneut-pipeline: seqneut-pipeline

docs: docs

description: |
  # Near real-time data on the human neutralizing antibody landscape to influenza virus to inform vaccine-strain selection in September 2025

  See [Kikawa et al (2025)](https://doi.org/10.1093/ve/veaf086) for details on this study.

  Briefly, this study used sequencing-based neutralization assays to measure titers to influenza viruses with HAs from seasonal H3N2 and H1N1 viruses representative of those circulating in the summer of 2025 against a set of human sera collected in late 2024 to spring of 2025.

  The numerical data and computer code are at [https://github.com/jbloomlab/flu-seqneut-2025](https://github.com/jbloomlab/flu-seqneut-2025)

viral_libraries:
  designed: data/viral_libraries/flu-seqneut-2025-barcode-to-strain_designed.csv
  actual: data/viral_libraries/flu-seqneut-2025-barcode-to-strain_actual.csv

viral_strain_plot_order: data/viral_libraries/flu-seqneut-2025_plot_order.csv

neut_standard_sets:
  loes2023: data/neut_standard_sets/loes2023_neut_standards.csv

illumina_barcode_parser_params:
  upstream: CCTACAATGTCGGATTTGTATTTAATAG
  downstream: ''
  minq: 20
  upstream_mismatch: 4
  bc_orientation: R2

default_process_plate_qc_thresholds: &default_process_plate_qc_thresholds
  avg_barcode_counts_per_well: 500
  min_neut_standard_frac_per_well: 0.005
  no_serum_per_viral_barcode_filters:
    min_frac: 0.0001
    max_fold_change: 4
    max_wells: 2
  per_neut_standard_barcode_filters:
    min_frac: 0.005
    max_fold_change: 4
    max_wells: 2
  min_neut_standard_count_per_well: 1000
  min_no_serum_count_per_viral_barcode_well: 100
  max_frac_infectivity_per_viral_barcode_well: 3
  min_dilutions_per_barcode_serum_replicate: 6

default_process_plate_curvefit_params: &default_process_plate_curvefit_params
  frac_infectivity_ceiling: 1
  fixtop: [0.6, 1] 
  fixbottom: 0
  fixslope: [0.8, 10]

default_process_plate_curvefit_qc:  &default_process_plate_curvefit_qc
  max_frac_infectivity_at_least: 0.0  # Allow 'completely neutralized' straight lines to be fit
  goodness_of_fit:  # EITHER R2 must be >= min_R2 or RMSD must be <= max_RMSD
    min_R2: 0.5
    max_RMSD: 0.15  # you may be able to increase this to more like 0.1
  serum_replicates_ignore_curvefit_qc: []
  barcode_serum_replicates_ignore_curvefit_qc: []

default_serum_titer_as: midpoint

default_serum_qc_thresholds: &default_serum_qc_thresholds
  min_replicates: 1
  max_fold_change_from_median: 6
  viruses_ignore_qc: []

sera_override_defaults: {}

